<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>ReADQuest</h1>
    <span id="badge" class="badge">…</span>
  </header>

  <section class="toggles">
    <label class="sw">
      <input type="checkbox" id="tagging">
      <span>Tag traffic <em>(User-Agent plus marker)</em></span>
    </label>
    <label class="sw danger">
      <input type="checkbox" id="blockProduction">
      <span>Block production <em>(the hosts listed under blocks in scope.config.json)</em></span>
    </label>
    <p class="hint" id="uaHint"></p>
  </section>

  <nav class="tabs">
    <button data-tab="health" class="on">Diagnostics</button>
    <button data-tab="tests">Tester</button>
    <button data-tab="log">Match log</button>
    <button data-tab="rules">Rules</button>
  </nav>

  <main>
    <div id="tab-health" class="tab on"></div>
    <div id="tab-tests" class="tab">
      <div class="bar"><button id="runTests">Run match tests</button><span id="testSummary"></span></div>
      <div id="testResults"></div>
    </div>
    <div id="tab-log" class="tab">
      <div class="bar"><button id="clearLog">Clear</button><span class="hint">Only requests that matched a rule.</span></div>
      <div id="logRows"></div>
    </div>
    <div id="tab-rules" class="tab">
      <div class="bar"><button id="copyRules">Copy rules JSON</button><span id="copyState"></span></div>
      <pre id="rulesJson"></pre>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
